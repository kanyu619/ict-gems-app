<title>ICT Gems App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: Trading-Terminal fürs Handy – Kopf mit Uhr/Suche oben, Kacheln nach Landkarten-Stufe, Konzept-Ansicht mit fester Ampel-Leiste unten (Daumen). */
:root{
  --bg:#eef0ec; --surface:#ffffff; --paper:#fafaf7; --ink:#1a1e20; --muted:#5b6569; --line:#d9ded9;
  --tp:#1f9d6b; --sl:#d64545; --step:#f59e0b; --stepInk:#8a5300;
  --tp-soft:#1f9d6b1f; --sl-soft:#d645451c; --step-soft:#f59e0b24; --gray-soft:#5b65691a;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1113; --surface:#151b1e; --paper:#f3f3ee; --ink:#e7ebe9; --muted:#97a2a6; --line:#263035;
  --tp:#34c48a; --sl:#ef6262; --step:#f7ad2c; --stepInk:#f7ad2c;
  --tp-soft:#34c48a24; --sl-soft:#ef62621f; --step-soft:#f7ad2c22; --gray-soft:#97a2a61f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1113; --surface:#151b1e; --paper:#f3f3ee; --ink:#e7ebe9; --muted:#97a2a6; --line:#263035;
  --tp:#34c48a; --sl:#ef6262; --step:#f7ad2c; --stepInk:#f7ad2c;
  --tp-soft:#34c48a24; --sl-soft:#ef62621f; --step-soft:#f7ad2c22; --gray-soft:#97a2a61f; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--step);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:720px;margin:0 auto}

/* Kopf */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 8px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em}
.brand small{font-weight:500;color:var(--muted);font-size:13px;letter-spacing:.04em;margin-left:6px}
.clock{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;line-height:1.3;font-variant-numeric:tabular-nums}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.search{margin-top:8px;position:relative}
.search input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 17px var(--f-body);padding:0 44px 0 14px}
.search input::placeholder{color:var(--muted)}
.search .clr{position:absolute;right:2px;top:2px;border:0;background:none;width:44px;height:44px;cursor:pointer;color:var(--muted);font-size:20px}
.filters{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.tog{height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font:600 15px var(--f-display);letter-spacing:.03em;cursor:pointer;display:flex;align-items:center;gap:6px}
.tog[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tog .n{font-family:var(--f-mono);font-size:12px;opacity:.75}

/* Zeitfenster-Banner */
.now{margin-top:12px;border-radius:var(--r);padding:10px 12px;background:var(--surface);border:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.now .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--muted)}
.now.on .dot{background:var(--tp);box-shadow:0 0 0 4px var(--tp-soft)}
.now.aplus .dot{background:var(--step);box-shadow:0 0 0 4px var(--step-soft)}
.now b{font-family:var(--f-display);font-size:17px;letter-spacing:.02em}
.now .sub{color:var(--muted);font-size:14px}

/* Fehlermuster */
.fehler{margin-top:10px}
.lbl{font:600 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fchips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;max-width:78%;border-left:3px solid var(--sl);background:var(--sl-soft);border-radius:0 10px 10px 0;padding:7px 10px}
.fchip b{display:block;font:700 16px var(--f-display);letter-spacing:.01em}
.fchip span{font-size:12.5px;color:var(--muted)}

/* Landkarte */
.map{display:flex;gap:4px;margin-top:16px;overflow-x:auto;scrollbar-width:none}
.map::-webkit-scrollbar{display:none}
.map .st{flex:1 0 auto;min-width:62px;text-align:center;padding:6px 4px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font:600 13px var(--f-display);color:var(--muted)}
.map .st.has{color:var(--ink);border-color:var(--step);background:var(--step-soft)}
.map .st i{font-style:normal;display:block;font-size:16px}
.map .st em{font-style:normal;font-family:var(--f-mono);font-size:11px}

section.stufe{margin-top:18px}
.sthead{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.sthead h2{font:700 22px var(--f-display);margin:0;letter-spacing:.01em}
.sthead span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column;min-height:200px}
.tile:active{transform:scale(.985)}
.tile .sk{background:var(--paper);height:96px;display:grid;place-items:center;border-bottom:1px solid var(--line)}
.tile .sk img{max-height:92px;width:100%;object-fit:contain}
.tile .tx{padding:10px 10px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.tile .ab{font:700 26px/1 var(--f-display);letter-spacing:.02em}
.tile .nm{font-size:13.5px;color:var(--muted);line-height:1.25}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:6px}
.bdg{font:600 12px var(--f-display);letter-spacing:.04em;padding:3px 8px;border-radius:20px;white-space:nowrap}
.bt-ungetestet{background:var(--gray-soft);color:var(--muted)}
.bt-läuft,.bt-laeuft{background:var(--step-soft);color:var(--stepInk)}
.bt-getestet{background:var(--tp-soft);color:var(--tp)}
.pl-passt{background:var(--tp-soft);color:var(--tp)}
.pl-passtnicht{background:var(--sl-soft);color:var(--sl)}
.pl-unklar{background:var(--step-soft);color:var(--stepInk)}
.empty{margin:28px 0;text-align:center;color:var(--muted)}
.emptyst{margin-top:14px;color:var(--muted);font-size:13.5px}
footer.foot{margin:28px 0 24px;color:var(--muted);font-size:12.5px;line-height:1.5}

/* Konzept-Ansicht */
#view{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.vhead{display:flex;align-items:center;gap:10px;padding-block:8px}
.vhead .t{min-width:0;flex:1}
.vhead .ab{font:700 26px/1 var(--f-display)}
.vhead .nm{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vsk{background:var(--paper);border-radius:var(--r);border:1px solid var(--line);display:block;width:100%;padding:4px;cursor:zoom-in;position:relative}
.vsk img{display:block;width:100%;max-height:24vh;object-fit:contain}
.vsk .hint{position:absolute;right:8px;bottom:6px;font:600 11px var(--f-display);letter-spacing:.08em;color:#5b6569;background:#ffffffcc;padding:2px 6px;border-radius:6px}
.satz{font-size:13.5px;color:var(--muted);margin:6px 2px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.satz.open{display:block}
.fmini{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.fmini span{flex:none;font:600 13px var(--f-display);letter-spacing:.02em;color:var(--sl);background:var(--sl-soft);border-radius:8px;padding:4px 8px}
.block{margin-top:10px}
.checks{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.chk{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;text-align:left;width:100%}
.chk .box{width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-weight:700;color:#fff}
.chk[aria-checked="true"]{border-color:var(--tp);background:var(--tp-soft)}
.chk[aria-checked="true"] .box{background:var(--tp);border-color:var(--tp)}
.chk .ct{font-size:15.5px;line-height:1.28}
.tag-d{display:inline-block;font:600 11.5px var(--f-display);letter-spacing:.04em;background:var(--step-soft);color:var(--stepInk);padding:1px 6px;border-radius:6px;margin-right:4px;vertical-align:1px}
.tag-p{display:inline-block;font:600 11.5px var(--f-display);letter-spacing:.04em;background:var(--gray-soft);color:var(--muted);padding:1px 6px;border-radius:6px;margin-right:4px;vertical-align:1px}
.trade{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.tf{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0;cursor:pointer;text-align:left}
.tf .k{font:700 13px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.tf.e .k{color:var(--stepInk)} .tf.s .k{color:var(--sl)} .tf.p .k{color:var(--tp)} .tf.i .k{color:var(--muted)}
.tf .v{font-size:14px;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.tf.open .v{-webkit-line-clamp:unset;display:block}
.miss{color:var(--muted);font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font:600 13.5px var(--f-display);letter-spacing:.03em;padding:6px 10px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.chip.mono{font-family:var(--f-mono);font-size:12.5px;font-weight:500}
.chip.d{border-color:var(--step);background:var(--step-soft);color:var(--stepInk)}
.chip.m{color:var(--muted);font-style:italic}
.planbox{margin-top:12px;border-radius:12px;border:1.5px solid var(--sl);background:var(--sl-soft);padding:10px 12px}
.planbox .lbl{color:var(--sl)}
.planbox p{margin:4px 0 0;font-size:14.5px;line-height:1.35}
details{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
summary{min-height:48px;display:flex;align-items:center;padding:0 12px;cursor:pointer;font:600 16px var(--f-display);letter-spacing:.02em;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;font-size:20px;color:var(--muted)}
details[open] summary::after{content:"–"}
.dbody{padding:0 12px 12px;font-size:14.5px}
.dbody ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.steps{display:flex;flex-direction:column;gap:6px}
.steps div{display:flex;gap:10px}
.steps .n{width:24px;height:24px;border-radius:50%;background:var(--step);color:#1a1e20;font:700 13px var(--f-display);display:grid;place-items:center;flex:none}
.steps .no{color:var(--muted)} .steps .no .n{background:var(--gray-soft);color:var(--muted)}
.xsk{display:block;width:100%;max-height:30vh;object-fit:contain;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:4px;margin:4px 0 8px;cursor:zoom-in}
.unk{color:var(--stepInk)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center}
.amp{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border-radius:12px;padding:8px 12px;min-height:56px}
.amp .lamp{width:22px;height:22px;border-radius:50%;flex:none}
.amp.red{background:var(--sl-soft)} .amp.red .lamp{background:var(--sl);box-shadow:0 0 0 5px var(--sl-soft)}
.amp.green{background:var(--tp-soft)} .amp.green .lamp{background:var(--tp);box-shadow:0 0 0 5px var(--tp-soft)}
.amp .at{min-width:0}
.amp .at b{display:block;font:700 15px var(--f-display);letter-spacing:.03em}
.amp .at span{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reset{height:56px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font:600 14px var(--f-display);cursor:pointer}

#full{position:fixed;inset:0;z-index:60;background:#fafaf7;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px calc(env(safe-area-inset-bottom,0px) + 8px)}
#full img{max-width:100%;max-height:100%;object-fit:contain}
#full button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);width:48px;height:48px;border-radius:50%;border:0;background:#1a1e20;color:#fff;font-size:22px;cursor:pointer}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="row">
      <div class="brand">ICT Gems<small>Abgleich</small></div>
      <div class="clock" id="clock"></div>
      <button class="iconbtn" id="themeBtn" aria-label="Hell/Dunkel wechseln">◐</button>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="Suche: IOFED, FVG, SIBI …" autocomplete="off" aria-label="Konzept suchen">
      <button class="clr" id="clr" aria-label="Suche leeren" hidden>×</button>
    </div>
    <div class="filters">
      <button class="tog" id="fNow" aria-pressed="false">⏱ Jetzt</button>
      <button class="tog" id="fAll" aria-pressed="false">alle zeigen <span class="n" id="hidN"></span></button>
    </div>
  </div>
</header>

<main class="wrap" id="home">
  <div class="now" id="now"><div class="dot"></div><div><b id="nowT"></b><div class="sub" id="nowS"></div></div></div>
  <div class="fehler"><div class="lbl">Vor jedem Trade · meine 3 häufigsten Fehler</div><div class="fchips" id="fehlerHome"></div></div>
  <div class="map" id="map"></div>
  <div id="list"></div>
  <footer class="foot" id="foot"></footer>
</main>

<div id="view" hidden></div>
<div id="full" hidden><img id="fullImg" alt=""><button id="fullX" aria-label="Schließen">×</button></div>

<script>
const D = /*__DATA__*/null;
const $ = s => document.querySelector(s);
const store = {get(k,d){try{const v=localStorage.getItem('gems:'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('gems:'+k,JSON.stringify(v))}catch(e){}}};
const state = {q:'', now:store.get('now',false), all:store.get('all',false), checks:{}};
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s).toLowerCase().replace(/<[^>]+>/g,'').replace(/[^a-z0-9äöüß]/g,'');

/* Theme */
(function(){const t=store.get('theme',null);if(t)document.documentElement.setAttribute('data-theme',t)})();
$('#themeBtn').onclick=()=>{const r=document.documentElement;const cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const nx=cur==='dark'?'light':'dark';r.setAttribute('data-theme',nx);store.set('theme',nx)};

/* Zeit: Plan-Fenster sind NY-Zeit, Anzeige in Europe/Berlin */
function tz(zone){const p=new Intl.DateTimeFormat('en-GB',{timeZone:zone,hour:'2-digit',minute:'2-digit',weekday:'short',hourCycle:'h23'}).formatToParts(new Date());const g=t=>p.find(x=>x.type===t).value;return{min:(+g('hour'))*60+(+g('minute')),wd:g('weekday')}}
const toMin = s => {const [h,m]=s.split(':').map(Number);return h*60+m};
const fmt = m => {m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const dur = m => m>=60?Math.floor(m/60)+' h '+(m%60)+' min':m+' min';
function timeCtx(){
  const ny=tz('America/New_York'), be=tz('Europe/Berlin');
  const off=((be.min-ny.min)%1440+1440)%1440;
  const wk=!['Sat','Sun'].includes(ny.wd);
  const wins=D.plan.windows.map(w=>({...w,a:toMin(w.from),b:toMin(w.to)}));
  const active=wk?wins.find(w=>ny.min>=w.a&&ny.min<w.b):null;
  let next=null,inMin=null;
  if(wk){const n=wins.find(w=>ny.min<w.a);if(n){next=n;inMin=n.a-ny.min}}
  if(!next){next=wins[0];const days=ny.wd==='Fri'?3:ny.wd==='Sat'?2:1;inMin=days*1440-ny.min+next.a; if(!wk&&ny.wd==='Sun'){inMin=1440-ny.min+next.a}}
  return{ny,be,off,wk,active,next,inMin};
}
/* Karten-Fenster zählen nur innerhalb der Plan-Fenster (Plan gilt). Karte nennt keine Zeit -> Plan-Fenster. */
const inPlan = ([a,b]) => D.plan.windows.some(w=>toMin(a)<toMin(w.to)&&toMin(b)>toMin(w.from));
function conceptActive(c,t){
  if(!t.active)return false;
  if(c.windows&&c.windows.length){return c.windows.some(([a,b])=>t.ny.min>=toMin(a)&&t.ny.min<toMin(b))}
  return true;
}
function renderClock(){
  const t=timeCtx();
  $('#clock').innerHTML='Berlin '+fmt(t.be.min)+'<br>NY '+fmt(t.ny.min);
  const box=$('#now');box.className='now'+(t.active?(t.active.name==='NY PM'?' aplus':' on'):'');
  if(t.active){
    $('#nowT').textContent=t.active.name+' läuft · bis '+fmt(t.active.b+t.off)+' Berlin';
    $('#nowS').textContent=(t.active.note?t.active.note+' · ':'')+'Plan: '+D.plan.hinweise[0];
  }else{
    $('#nowT').textContent='Kein Plan-Fenster';
    $('#nowS').textContent='Nächstes: '+t.next.name+' '+fmt(t.next.a+t.off)+'–'+fmt(t.next.b+t.off)+' Berlin (in '+dur(t.inMin)+') · '+D.plan.hinweise[1];
  }
  return t;
}

/* Startseite */
function badges(c){
  const bt={ungetestet:'Backtest: ungetestet','läuft':'Backtest: läuft',getestet:'Backtest: getestet'}[c.backtest]||('Backtest: '+c.backtest);
  const pl=c.plan==='passt'?(c.planBedingt?'Plan: passt (bedingt)':'Plan: passt'):c.plan==='passt nicht'?'Plan: passt nicht':'Plan: ⚠️ unklar';
  return '<span class="bdg bt-'+esc(c.backtest)+'">'+bt+'</span><span class="bdg pl-'+c.plan.replace(' ','')+'">'+pl+'</span>';
}
function visible(){
  const t=timeCtx(), q=norm(state.q);
  return D.concepts.filter(c=>{
    if(q){return [c.name,c.abk,c.file,...c.aliases].some(x=>norm(x).includes(q))}
    if(!state.all&&c.plan==='passt nicht')return false;
    if(state.now&&!conceptActive(c,t))return false;
    return true;
  });
}
function renderHome(){
  const t=renderClock();
  const hidden=D.concepts.filter(c=>c.plan==='passt nicht').length;
  $('#hidN').textContent=hidden?'('+hidden+' aus)':'(0 aus)';
  $('#fNow').setAttribute('aria-pressed',state.now);$('#fAll').setAttribute('aria-pressed',state.all);
  $('#clr').hidden=!state.q;
  const vis=visible();
  const st=D.stufen.length?D.stufen:[{name:'Konzepte',icon:'',frage:''}];
  $('#map').innerHTML=st.map(s=>{const n=D.concepts.filter(c=>c.stufe===s.name).length;return '<div class="st'+(n?' has':'')+'"><i>'+esc(s.icon)+'</i>'+esc(s.name)+'<em> '+n+'</em></div>'}).join('');
  let html='';const empty=[];
  st.forEach(s=>{
    const cs=vis.filter(c=>c.stufe===s.name||(!D.stufen.length));
    if(!cs.length){if(!D.concepts.some(c=>c.stufe===s.name))empty.push(s.icon+' '+s.name);return}
    html+='<section class="stufe"><div class="sthead"><h2>'+esc(s.icon+' '+s.name)+'</h2><span>'+esc(s.frage)+'</span></div><div class="grid">'+
      cs.map(c=>'<button class="tile" data-id="'+c.id+'"><div class="sk">'+(c.svg?'<img alt="" src="'+c.svg+'">':'<span class="miss">Skizze fehlt</span>')+'</div><div class="tx"><div class="ab">'+esc(c.abk)+'</div><div class="nm">'+esc(c.name)+'</div><div class="badges">'+badges(c)+'</div></div></button>').join('')+'</div></section>';
  });
  const orphan=vis.filter(c=>D.stufen.length&&!D.stufen.some(s=>s.name===c.stufe));
  if(orphan.length)html+='<section class="stufe"><div class="sthead"><h2>Ohne Stufe</h2></div><div class="grid">'+orphan.map(c=>'<button class="tile" data-id="'+c.id+'"><div class="tx"><div class="ab">'+esc(c.abk)+'</div><div class="nm">'+esc(c.name)+'</div><div class="badges">'+badges(c)+'</div></div></button>').join('')+'</div></section>';
  if(!vis.length){
    html='<div class="empty">'+(state.q?'Kein Konzept zu „'+esc(state.q)+'“.':state.now?'Jetzt passt kein Konzept: kein Plan-Fenster.<br>Nächstes: '+t.next.name+' '+fmt(t.next.a+t.off)+' Berlin.':'Keine Konzepte sichtbar.')+'</div>';
  }else if(empty.length&&!state.q&&!state.now){html+='<div class="emptyst">Noch keine Karte: '+esc(empty.join(' · '))+'</div>'}
  $('#list').innerHTML=html;
}
$('#list').addEventListener('click',e=>{const b=e.target.closest('.tile');if(b)location.hash=b.dataset.id});
$('#q').addEventListener('input',e=>{state.q=e.target.value;renderHome()});
$('#clr').onclick=()=>{state.q='';$('#q').value='';renderHome();$('#q').focus()};
$('#fNow').onclick=()=>{state.now=!state.now;store.set('now',state.now);renderHome()};
$('#fAll').onclick=()=>{state.all=!state.all;store.set('all',state.all);renderHome()};
$('#fehlerHome').innerHTML=D.fehler.map(f=>'<div class="fchip"><b>'+esc(f.q)+'</b><span>'+esc(f.sub)+'</span></div>').join('');
$('#foot').innerHTML='Stand '+esc(D.stand)+' · '+D.concepts.length+' Konzepte aus der ICT Gems Bibliothek.<br>Abgleich-Werkzeug, kein Signalgeber. Karte ungetestet → '+esc('Trading-Plan ab 15.10.2026')+' gilt.';

/* Konzept-Ansicht */
const MISS='<span class="miss">— fehlt in Karte</span>';
function field(f){
  if(!f)return MISS;
  let h=f.html||'';
  if(f.missing)h=MISS+(h?' · '+h:'');
  return h||MISS;
}
function renderView(c){
  const v=$('#view');
  const ch=state.checks[c.id]||(state.checks[c.id]=c.checks.map(()=>false));
  const wins=c.windows&&c.windows.length?c.windows.map(w=>inPlan(w)?'<span class="chip mono">'+w[0]+'–'+w[1]+' NY</span>':'<span class="chip mono d">⚠️ '+w[0]+'–'+w[1]+' NY · außerhalb Plan</span>').join(''):
    '<span class="chip m">Zeitfenster — fehlt in Karte</span><span class="chip mono">Plan: NY AM 09:30–11:00</span>';
  const tfs=c.tfs.length?c.tfs.map(t=>'<span class="chip'+(t.d?' d':'')+'">'+(t.d?'⚠️ ':'')+esc(t.t)+'</span>').join(''):'<span class="chip m">Timeframes — fehlt in Karte</span>';
  const T=c.trade;
  v.innerHTML='<div class="wrap">'+
   '<div class="vhead"><button class="iconbtn" id="back" aria-label="Zurück">←</button><div class="t"><div class="ab">'+esc(c.abk)+'</div><div class="nm">'+esc(c.name)+'</div></div></div>'+
   '<div class="badges" style="padding-top:0;margin:0 0 8px">'+badges(c)+'</div>'+
   (c.svg?'<button class="vsk" id="skBtn" aria-label="Skizze im Vollbild"><img alt="Skizze '+esc(c.abk)+'" src="'+c.svg+'"><span class="hint">VOLLBILD</span></button>':'<div class="planbox"><span class="miss">Skizze — fehlt in Karte</span></div>')+
   (c.satz?'<p class="satz" id="satz">'+c.satz+'</p>':'')+
   '<div class="block fmini">'+D.fehler.map(f=>'<span>'+esc(f.q)+'</span>').join('')+'</div>'+
   '<div class="block"><div class="lbl">Checkliste – nur wenn alles ✔</div><div class="checks">'+
     (c.checks.length?c.checks.map((t,i)=>'<button class="chk" role="checkbox" aria-checked="'+ch[i]+'" data-i="'+i+'"><span class="box">'+(ch[i]?'✓':'')+'</span><span class="ct">'+t+'</span></button>').join(''):MISS)+'</div></div>'+
   '<div class="block"><div class="lbl">Trade auf einen Blick</div><div class="trade">'+
     '<button class="tf e"><div class="k">🎯 Entry</div><div class="v">'+field(T.entry)+'</div></button>'+
     '<button class="tf s"><div class="k">🛑 SL</div><div class="v">'+field(T.sl)+'</div></button>'+
     '<button class="tf p"><div class="k">💰 TP</div><div class="v">'+field(T.tp)+'</div></button>'+
     '<button class="tf i"><div class="k">❌ ungültig wenn</div><div class="v">'+field(T.inv)+'</div></button>'+
   '</div></div>'+
   '<div class="block"><div class="lbl">Zeitfenster · Timeframes</div><div class="chips">'+wins+tfs+'</div></div>'+
   (c.planLines.length?'<div class="planbox"><div class="lbl">⚠️ Passt zu meinem Plan?</div>'+c.planLines.map(l=>'<p>'+l+'</p>').join('')+'</div>':'<div class="planbox"><div class="lbl">Plan-Abgleich</div><p class="miss">— fehlt in Karte</p></div>')+
   (c.unklar.length?'<details open><summary>⚠️ Unklar in der Karte ('+c.unklar.length+')</summary><div class="dbody"><ul>'+c.unklar.map(u=>'<li class="unk">'+u+'</li>').join('')+'</ul></div></details>':'')+
   (c.steps.length?'<details><summary>So läuft\'s ab</summary><div class="dbody"><div class="steps">'+c.steps.map(s=>'<div'+(s.no?' class="no"':'')+'><span class="n">'+esc(s.n)+'</span><span><b>'+s.name+'</b> – '+s.see+'</span></div>').join('')+'</div>'+(c.stepsNote.length?'<p>'+c.stepsNote.join('<br>')+'</p>':'')+'</div></details>':'')+
   (c.extra||[]).map(x=>'<details><summary>'+x.title+'</summary><div class="dbody">'+x.svgs.map(u=>'<img class="xsk" alt="" src="'+u+'" data-src="'+u+'">').join('')+(x.items.length?'<ul>'+x.items.map(i=>'<li>'+i+'</li>').join('')+'</ul>':'')+'</div></details>').join('')+
   (c.zeitNotes.length?'<details><summary>Zeit & Timeframes (Karte)</summary><div class="dbody"><ul>'+c.zeitNotes.map(z=>'<li>'+z+'</li>').join('')+'</ul></div></details>':'')+
   (c.details.length?'<details><summary>Details, Varianten, Quellen</summary><div class="dbody"><ul>'+c.details.map(z=>'<li>'+z+'</li>').join('')+'</ul></div></details>':'')+
   (c.video.length?'<details><summary>📸 Aus dem Video</summary><div class="dbody"><p>'+c.video.join('<br>')+'</p></div></details>':'')+
   '</div>'+
   '<div class="bar"><div class="amp" id="amp"><div class="lamp"></div><div class="at"><b id="ampT"></b><span id="ampS"></span></div></div><button class="reset" id="rst">Neu</button></div>';
  v.hidden=false;v.scrollTop=0;document.body.style.overflow='hidden';
  const amp=()=>{const miss=c.checks.findIndex((_,i)=>!ch[i]);const a=$('#amp');
    if(!c.checks.length){a.className='amp red';$('#ampT').textContent='Keine Checkliste';$('#ampS').textContent='— fehlt in Karte';return}
    if(miss<0){a.className='amp green';$('#ampT').textContent='Alle '+c.checks.length+' Punkte ✔';$('#ampS').textContent='Bild passt zur Karte · Plan-Box beachten'}
    else{a.className='amp red';const done=ch.filter(Boolean).length;$('#ampT').textContent='Fehlt ('+done+'/'+c.checks.length+')';$('#ampS').textContent=c.checks[miss].replace(/<span class="tag-[dp]">[^<]*<\/span>/g,'').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&')}};
  amp();
  v.querySelectorAll('.chk').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;ch[i]=!ch[i];b.setAttribute('aria-checked',ch[i]);b.querySelector('.box').textContent=ch[i]?'✓':'';amp()});
  v.querySelectorAll('.tf').forEach(b=>b.onclick=()=>b.classList.toggle('open'));
  const sz=$('#satz');if(sz)sz.onclick=()=>sz.classList.toggle('open');
  $('#rst').onclick=()=>{ch.fill(false);v.querySelectorAll('.chk').forEach(b=>{b.setAttribute('aria-checked','false');b.querySelector('.box').textContent=''});amp()};
  $('#back').onclick=()=>{location.hash=''};
  const openFull=src=>{$('#fullImg').src=src;$('#full').hidden=false;const f=$('#full');if(f.requestFullscreen)f.requestFullscreen().catch(()=>{})};
  const sk=$('#skBtn');if(sk)sk.onclick=()=>openFull(c.svg);
  v.querySelectorAll('.xsk').forEach(im=>im.onclick=()=>openFull(im.dataset.src));
}
function closeFull(){$('#full').hidden=true;if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}
$('#full').onclick=closeFull;
function route(){
  const id=location.hash.replace('#','');const c=D.concepts.find(x=>x.id===id);
  if(c){renderView(c)}else{$('#view').hidden=true;document.body.style.overflow='';closeFull();renderHome()}
}
addEventListener('hashchange',route);
setInterval(()=>{if($('#view').hidden)renderHome();else renderClock()},30000);
$('#q').value=state.q;
route();
</script>
