<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1113"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>ICT Gems App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: Trading-Terminal fürs Handy – Kopf mit Uhr/Suche oben, Kacheln nach Landkarten-Stufe, Konzept-Ansicht mit fester Ampel-Leiste unten (Daumen). */
:root{
  --bg:#eef0ec; --surface:#ffffff; --paper:#fafaf7; --ink:#1a1e20; --muted:#5b6569; --line:#d9ded9;
  --tp:#1f9d6b; --sl:#d64545; --step:#f59e0b; --stepInk:#8a5300;
  --tp-soft:#1f9d6b1f; --sl-soft:#d645451c; --step-soft:#f59e0b24; --gray-soft:#5b65691a;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1113; --surface:#151b1e; --paper:#f3f3ee; --ink:#e7ebe9; --muted:#97a2a6; --line:#263035;
  --tp:#34c48a; --sl:#ef6262; --step:#f7ad2c; --stepInk:#f7ad2c;
  --tp-soft:#34c48a24; --sl-soft:#ef62621f; --step-soft:#f7ad2c22; --gray-soft:#97a2a61f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1113; --surface:#151b1e; --paper:#f3f3ee; --ink:#e7ebe9; --muted:#97a2a6; --line:#263035;
  --tp:#34c48a; --sl:#ef6262; --step:#f7ad2c; --stepInk:#f7ad2c;
  --tp-soft:#34c48a24; --sl-soft:#ef62621f; --step-soft:#f7ad2c22; --gray-soft:#97a2a61f; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--step);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:720px;margin:0 auto}

/* Kopf */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 8px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em}
.brand small{font-weight:500;color:var(--muted);font-size:13px;letter-spacing:.04em;margin-left:6px}
.clock{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;line-height:1.3;font-variant-numeric:tabular-nums}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.search{margin-top:8px;position:relative}
.search input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 17px var(--f-body);padding:0 44px 0 14px}
.search input::placeholder{color:var(--muted)}
.search .clr{position:absolute;right:2px;top:2px;border:0;background:none;width:44px;height:44px;cursor:pointer;color:var(--muted);font-size:20px}
.filters{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.tog{height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font:600 15px var(--f-display);letter-spacing:.03em;cursor:pointer;display:flex;align-items:center;gap:6px}
.tog[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tog .n{font-family:var(--f-mono);font-size:12px;opacity:.75}

/* Zeitfenster-Banner */
.now{margin-top:12px;border-radius:var(--r);padding:10px 12px;background:var(--surface);border:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.now .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--muted)}
.now.on .dot{background:var(--tp);box-shadow:0 0 0 4px var(--tp-soft)}
.now.aplus .dot{background:var(--step);box-shadow:0 0 0 4px var(--step-soft)}
.now b{font-family:var(--f-display);font-size:17px;letter-spacing:.02em}
.now .sub{color:var(--muted);font-size:14px}

/* Fehlermuster */
.fehler{margin-top:10px}
.lbl{font:600 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fchips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;max-width:78%;border-left:3px solid var(--sl);background:var(--sl-soft);border-radius:0 10px 10px 0;padding:7px 10px}
.fchip b{display:block;font:700 16px var(--f-display);letter-spacing:.01em}
.fchip span{font-size:12.5px;color:var(--muted)}

/* Landkarte */
.map{display:flex;gap:4px;margin-top:16px;overflow-x:auto;scrollbar-width:none}
.map::-webkit-scrollbar{display:none}
.map .st{flex:1 0 auto;min-width:62px;text-align:center;padding:6px 4px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font:600 13px var(--f-display);color:var(--muted)}
.map .st.has{color:var(--ink);border-color:var(--step);background:var(--step-soft)}
.map .st i{font-style:normal;display:block;font-size:16px}
.map .st em{font-style:normal;font-family:var(--f-mono);font-size:11px}

section.stufe{margin-top:18px}
.sthead{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.sthead h2{font:700 22px var(--f-display);margin:0;letter-spacing:.01em}
.sthead span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column;min-height:200px}
.tile:active{transform:scale(.985)}
.tile .sk{background:var(--paper);height:96px;display:grid;place-items:center;border-bottom:1px solid var(--line)}
.tile .sk img{max-height:92px;width:100%;object-fit:contain}
.tile .tx{padding:10px 10px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.tile .ab{font:700 26px/1 var(--f-display);letter-spacing:.02em}
.tile .nm{font-size:13.5px;color:var(--muted);line-height:1.25}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:6px}
.bdg{font:600 12px var(--f-display);letter-spacing:.04em;padding:3px 8px;border-radius:20px;white-space:nowrap}
.bt-ungetestet{background:var(--gray-soft);color:var(--muted)}
.bt-läuft,.bt-laeuft{background:var(--step-soft);color:var(--stepInk)}
.bt-getestet{background:var(--tp-soft);color:var(--tp)}
.pl-passt{background:var(--tp-soft);color:var(--tp)}
.pl-passtnicht{background:var(--sl-soft);color:var(--sl)}
.pl-unklar{background:var(--step-soft);color:var(--stepInk)}
.empty{margin:28px 0;text-align:center;color:var(--muted)}
.emptyst{margin-top:14px;color:var(--muted);font-size:13.5px}
footer.foot{margin:28px 0 24px;color:var(--muted);font-size:12.5px;line-height:1.5}

/* Konzept-Ansicht */
#view{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.vhead{display:flex;align-items:center;gap:10px;padding-block:8px}
.vhead .t{min-width:0;flex:1}
.vhead .ab{font:700 26px/1 var(--f-display)}
.vhead .nm{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vsk{background:var(--paper);border-radius:var(--r);border:1px solid var(--line);display:block;width:100%;padding:4px;cursor:zoom-in;position:relative}
.vsk img{display:block;width:100%;max-height:24vh;object-fit:contain}
.vsk .hint{position:absolute;right:8px;bottom:6px;font:600 11px var(--f-display);letter-spacing:.08em;color:#5b6569;background:#ffffffcc;padding:2px 6px;border-radius:6px}
.satz{font-size:13.5px;color:var(--muted);margin:6px 2px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.satz.open{display:block}
.fmini{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.fmini span{flex:none;font:600 13px var(--f-display);letter-spacing:.02em;color:var(--sl);background:var(--sl-soft);border-radius:8px;padding:4px 8px}
.block{margin-top:10px}
.checks{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.chk{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;text-align:left;width:100%}
.chk .box{width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-weight:700;color:#fff}
.chk[aria-checked="true"]{border-color:var(--tp);background:var(--tp-soft)}
.chk[aria-checked="true"] .box{background:var(--tp);border-color:var(--tp)}
.chk .ct{font-size:15.5px;line-height:1.28}
.tag-d{display:inline-block;font:600 11.5px var(--f-display);letter-spacing:.04em;background:var(--step-soft);color:var(--stepInk);padding:1px 6px;border-radius:6px;margin-right:4px;vertical-align:1px}
.tag-p{display:inline-block;font:600 11.5px var(--f-display);letter-spacing:.04em;background:var(--gray-soft);color:var(--muted);padding:1px 6px;border-radius:6px;margin-right:4px;vertical-align:1px}
.trade{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.tf{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0;cursor:pointer;text-align:left}
.tf .k{font:700 13px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.tf.e .k{color:var(--stepInk)} .tf.s .k{color:var(--sl)} .tf.p .k{color:var(--tp)} .tf.i .k{color:var(--muted)}
.tf .v{font-size:14px;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.tf.open .v{-webkit-line-clamp:unset;display:block}
.miss{color:var(--muted);font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font:600 13.5px var(--f-display);letter-spacing:.03em;padding:6px 10px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.chip.mono{font-family:var(--f-mono);font-size:12.5px;font-weight:500}
.chip.d{border-color:var(--step);background:var(--step-soft);color:var(--stepInk)}
.chip.m{color:var(--muted);font-style:italic}
.planbox{margin-top:12px;border-radius:12px;border:1.5px solid var(--sl);background:var(--sl-soft);padding:10px 12px}
.planbox .lbl{color:var(--sl)}
.planbox p{margin:4px 0 0;font-size:14.5px;line-height:1.35}
details{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
summary{min-height:48px;display:flex;align-items:center;padding:0 12px;cursor:pointer;font:600 16px var(--f-display);letter-spacing:.02em;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;font-size:20px;color:var(--muted)}
details[open] summary::after{content:"–"}
.dbody{padding:0 12px 12px;font-size:14.5px}
.dbody ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.steps{display:flex;flex-direction:column;gap:6px}
.steps div{display:flex;gap:10px}
.steps .n{width:24px;height:24px;border-radius:50%;background:var(--step);color:#1a1e20;font:700 13px var(--f-display);display:grid;place-items:center;flex:none}
.steps .no{color:var(--muted)} .steps .no .n{background:var(--gray-soft);color:var(--muted)}
.xsk{display:block;width:100%;max-height:30vh;object-fit:contain;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:4px;margin:4px 0 8px;cursor:zoom-in}
.unk{color:var(--stepInk)}
/* Aus den Videos */
.vids{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.vid{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vhd{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;width:100%;min-height:44px;padding:8px 12px;border:0;background:none;text-align:left;cursor:pointer}
.vhd .vd{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.vhd .vt{font:600 15px var(--f-display);letter-spacing:.01em;flex:1 1 60%}
.vhd .vts{font-family:var(--f-mono);font-size:12px;color:var(--stepInk)}
.vhd::after{content:"+";margin-left:auto;color:var(--muted);font-size:18px}
.vhd.open::after{content:"–"}
.vbody{padding:0 12px 10px;font-size:14px}
.vbody .vk{margin:0 0 6px}
.vr{display:flex;flex-direction:column;gap:4px;margin:4px 0 8px}
.vr div{display:flex;gap:8px}.vr .vrt{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none;min-width:72px;padding-top:2px}
.vlink{display:inline-block;font:600 14px var(--f-display);color:var(--sl);text-decoration:none;border:1px solid var(--sl);border-radius:20px;padding:6px 12px;min-height:36px}
.vo{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
.legend{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
/* Rückfrage */
.ask{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.askLog{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.askLog:empty{display:none}
.msg{font-size:14.5px;line-height:1.4;padding:8px 10px;border-radius:12px;max-width:92%;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg)}
.msg.ai{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.askSug{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 0 8px}
.askSug::-webkit-scrollbar{display:none}
.askSug button{flex:none;font:600 13px var(--f-display);letter-spacing:.02em;border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:7px 11px;min-height:36px;cursor:pointer}
.askRow{display:flex;gap:8px;align-items:flex-end}
.askRow textarea{flex:1;min-width:0;min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:15px var(--f-body);padding:9px 10px;resize:vertical}
.askRow button{height:48px;padding:0 14px;border-radius:10px;border:0;background:var(--step);color:#1a1e20;font:700 15px var(--f-display);letter-spacing:.02em;cursor:pointer;flex:none}
.askRow button:disabled{opacity:.5}
.askNote{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
.askNote a{color:inherit}
/* Backtest-Lab */
.lab{display:flex;flex-direction:column;gap:6px}
.labq{display:flex;flex-direction:column;gap:6px;width:100%;padding:10px 12px;border:1px solid var(--line);border-left:3px solid var(--step);border-radius:12px;background:var(--surface);text-align:left;cursor:pointer}
.labq .lq{font-size:15px;line-height:1.3}
.labq .lm{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font:600 13px var(--f-display);color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center}
.amp{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border-radius:12px;padding:8px 12px;min-height:56px}
.amp .lamp{width:22px;height:22px;border-radius:50%;flex:none}
.amp.red{background:var(--sl-soft)} .amp.red .lamp{background:var(--sl);box-shadow:0 0 0 5px var(--sl-soft)}
.amp.green{background:var(--tp-soft)} .amp.green .lamp{background:var(--tp);box-shadow:0 0 0 5px var(--tp-soft)}
.amp .at{min-width:0}
.amp .at b{display:block;font:700 15px var(--f-display);letter-spacing:.03em}
.amp .at span{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reset{height:56px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font:600 14px var(--f-display);cursor:pointer}

#full{position:fixed;inset:0;z-index:60;background:#fafaf7;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px calc(env(safe-area-inset-bottom,0px) + 8px)}
#full img{max-width:100%;max-height:100%;object-fit:contain}
#full button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);width:48px;height:48px;border-radius:50%;border:0;background:#1a1e20;color:#fff;font-size:22px;cursor:pointer}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="row">
      <div class="brand">ICT Gems<small>Abgleich</small></div>
      <div class="clock" id="clock"></div>
      <button class="iconbtn" id="themeBtn" aria-label="Hell/Dunkel wechseln">◐</button>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="Suche: IOFED, FVG, SIBI …" autocomplete="off" aria-label="Konzept suchen">
      <button class="clr" id="clr" aria-label="Suche leeren" hidden>×</button>
    </div>
    <div class="filters">
      <button class="tog" id="fNow" aria-pressed="false">⏱ Jetzt</button>
      <button class="tog" id="fAll" aria-pressed="false">alle zeigen <span class="n" id="hidN"></span></button>
    </div>
  </div>
</header>

<main class="wrap" id="home">
  <div class="now" id="now"><div class="dot"></div><div><b id="nowT"></b><div class="sub" id="nowS"></div></div></div>
  <div class="fehler"><div class="lbl">Vor jedem Trade · meine 3 häufigsten Fehler</div><div class="fchips" id="fehlerHome"></div></div>
  <div class="map" id="map"></div>
  <div id="list"></div>
  <section class="stufe" id="lab"></section>
  <footer class="foot" id="foot"></footer>
</main>

<div id="view" hidden></div>

–1:26).", "Schluss des Beispiels: Market on Close in der letzten Handelsstunde (3:03–3:13)."], "plan": "passt", "planBedingt": true, "planLines": ["<b>Nur mit MSS.</b> Die Logik passt (Sweep → Richtungswechsel → Rücklauf → Limit). Aber der CISD braucht <b>keinen</b> Schluss über dem Level. Dein M5-MSS verlangt einen Körperschluss. Der CISD ist also schwächer und kein Ersatz für den MSS.", "⚠️ Das Beispiel liegt um 14:06 NY = NY PM, für dich nur A+. Der Stop am Dochttief ist klein. Erst beobachten, nicht übernehmen. → Trading-Plan ab 15.10.2026, Fehlermuster FTMO-Trades", "<b>Ungetestet.</b> Forward prüfen: Kommt der CISD bei deinen Setups vor dem M5-MSS, und hält danach die CE des Dochts?"], "video": ["2026-11-06 – Wicks After a Change in the State of Delivery: Eröffnung der großen Kerze 30.519,75, Tief des Rücklaufs 30.519 = 3 Ticks darunter (0:19–0:33). Laut Gemini-Bild: 5-min-Chart, 30.06.2026. Instrument zweifelhaft (siehe Video-Notiz)."], "details": ["<b>Order Block:</b> Sobald der Preis über den Eröffnungspreis handelt, „validates this is an order block“ (1:38). → Order Block", "<b>Discount Sensitivity:</b> Der Docht nach dem CISD reagiert in seiner oberen Hälfte bis zur CE (0:45).", "<b>Stop-Variante:</b> Hier Stop am <b>Dochttief</b>. Im Video 2026-11-16 – Intraday Pinball with Time and Price Grid Stop <b>unter der CE</b> des Dochts. → Consequent Encroachment", "<b>Nicht verwechseln mit:</b> dem MSS in deinem Plan (Körperschluss über/unter dem letzten Swing).", "<b>Quellen:</b> 2026-11-06 – Wicks After a Change in the State of Delivery @ 0:00–0:58, 1:08–2:22", "<b>Backtest:</b> ungetestet"], "unklar": [], "hash": "b5e5857a", "lack": ["Zeitfenster"], "extra": [], "quelle": "ICT Gems", "fragen": ["Kommt der CISD bei deinen Setups vor dem M5-MSS, und hält danach die CE des Dochts?"]}, {"id": "ce", "name": "Consequent Encroachment", "abk": "CE", "file": "Consequent Encroachment", "aliases": ["CE", "Consequent Encroachment", "Mitte der FVG", "50 % FVG"], "stufe": "Entry", "backtest": "ungetestet", "videos": [{"name": "2026-09-28 – Patchwork Inside A Fair Value Gap", "datum": "2026-09-28", "titel": "Patchwork Inside A Fair Value Gap", "url": "https://youtube.com/shorts/fS_OrvYSDbI", "kanal": "ICT Gems", "orig": "ICT 2026 Market Review – 08.04.2026", "laenge": "1:00 (Short)", "kern": "Eine Lücke (FVG) wird entweder <b>gefüllt</b> oder es entsteht <b>Patchwork</b> (Flickwerk). Soll sie offen bleiben, dürfen <b>Kerzenkörper nicht über die Mitte (CE)</b>, nur Dochte dürfen hineinstechen. Wird ein Teil der Lücke nur von einem einzigen Docht durchquert, zählt er so, als wäre er noch offen.", "regeln": [{"r": "Zwei Möglichkeiten: Die Lücke wird gefüllt, oder es entsteht Patchwork", "t": "0:00–0:06"}, {"r": "FVG = Tief der einen Kerze bis Hoch der anderen", "t": "0:05–0:09"}, {"r": "Soll die Lücke offen bleiben: Körper dürfen nicht in die obere Hälfte. Das ist „institutional order flow“", "t": "0:09–0:23"}, {"r": "Körper bleiben draußen, Dochte dürfen antippen, Körper erreichen die CE nicht", "t": "0:23–0:29"}, {"r": "„Nur die Dochte dürfen das“", "t": "0:29–0:36"}, {"r": "Nur Körper betrachtet: Zwischen Kerzenhoch und dem höchsten Open/Close bleibt eine kleine Trennung. Die wird nur von einem Docht durchquert, und das ist so, als gäbe es gar keinen Docht", "t": "0:38–0:54"}, {"r": "Stärker, wenn gar kein Kerzenteil (Docht oder Körper) in der Lücke ist", "t": "0:55–1:00"}], "ts": "0:20, 0:27, 0:34"}, {"name": "2024-08-08 – ICT Explains True Fair Value Gaps", "datum": "2024-08-08", "titel": "ICT Explains True Fair Value Gaps", "url": "https://youtube.com/shorts/sPyOWwKEsnU", "kanal": "ICT Gems", "orig": "ICT 2024 Mentorship – Lecture #2, 06.08.2024", "laenge": "0:24 (Short)", "kern": "Sticht ein Docht nur <b>bis zur Mitte (CE) oder weniger</b> in die Lücke, ignorierst du ihn. Die Kante der Lücke ziehst du dann an den <b>Körper</b> der Kerze. So bekommst du die „echte“ FVG.", "regeln": [{"r": "Gilt für eine FVG bzw. Imbalance, auch wenn ein <b>Volume Imbalance</b> darin liegt", "t": "0:00–0:04"}, {"r": "Ein Docht in der FVG hebt sie nicht auf, solange er <b>unter der CE</b> bleibt", "t": "0:04–0:13"}, {"r": "Jeder schwache Docht bis zur CE oder weniger: <b>ignorieren</b>", "t": "0:13–0:18"}, {"r": "„Take it to the body of the candle“ → das ergibt die <b>echte</b> FVG", "t": "0:18–0:24"}], "ts": "0:10, 0:15"}, {"name": "2024-08-10 – What makes a Price Range Balanced", "datum": "2024-08-10", "titel": "What makes a Price Range Balanced", "url": "https://youtube.com/shorts/X3W73C7EdGU", "kanal": "ICT Gems", "orig": "ICT 2024 Mentorship – Lecture #4, 08.08.2024", "laenge": "0:48 (Short)", "kern": "Eine Preisspanne ist <b>ausgeglichen (balanced)</b>, wenn der Preis sie in <b>beide Richtungen</b> durchlaufen hat: erst mit einer großen Kerze hoch, dann mit der nächsten Kerze runter. Im Beispiel liegt das Tief dieser Gegenbewegung zugleich auf der <b>CE der New Day Opening Gap</b> vom Mittwoch, mehrere Dinge treffen also zusammen. Später läuft der Preis zurück, trifft den <b>Schlusskurs der großen grünen Kerze</b> und gräbt sich in deren Körper.", "regeln": [{"r": "Ausgleich zwischen dem Körper dieser Kerze und dem Open der nächsten, die runterhandelt", "t": "0:00–0:07"}, {"r": "Von diesem Tief zu diesem Hoch = Balanced Price Range. Beide Richtungen wurden angeboten", "t": "0:07–0:13"}, {"r": "Dasselbe Tief ist die <b>CE der Mittwochs-NDOG</b> → „alles läuft zusammen“", "t": "0:13–0:21"}, {"r": "Lauf weg, Schluss, Open, runter zur CE, dann durch und das Hoch zurücklassen", "t": "0:21–0:30"}, {"r": "Hoch bis Tief = BPR, weil zwischen Tief der einen und Hoch der anderen Kerze hoch <b>und</b> runter gehandelt wurde", "t": "0:30–0:40"}, {"r": "Markt kommt zurück, trifft den <b>Schlusskurs der grünen Kerze</b> und gräbt in ihren Körper", "t": "0:40–0:48"}], "ts": "0:17"}, {"name": "2026-10-04 – FVG before a Stop Run using the Candle's Bodies", "datum": "2026-10-04", "titel": "FVG before a Stop Run using the Candle's Bodies", "url": "https://youtube.com/shorts/CRYwiM3UdZI", "kanal": "ICT Gems", "orig": "ICT 2026 Market Commentary – 06.04.2026", "laenge": "0:46 (Short)", "kern": "- <b>Dochte behandelt ICT wie eine Lücke</b> und hat dafür eine eigene Mitte (CE). - Den Swing High liest er an den <b>Körpern</b>: „Die Körper zeigen das echte Volumen, Dochte dürfen Schaden anrichten.“ - Läuft der Preis später über das Körper-Hoch und sticht in die CE des Dochts, schafft aber den Docht nicht, schau <b>rückwärts</b>. Die <b>erste FVG</b> vor diesem Lauf ist die, die die Liquidität geholt hat.", "regeln": [{"r": "Buy-Side wurde mit diesem Docht geholt", "t": "0:00–0:04"}, {"r": "Was machen wir mit Dochten? <b>Wie eine Lücke behandeln</b> → CE", "t": "0:04–0:07"}, {"r": "Schluss darüber, aber die oberen Level nicht erreicht → Rücklauf, dann Abverkauf", "t": "0:07–0:12"}, {"r": "Der Docht gehört zum Lauf, aber <b>die Körper zeigen das echte Volumen</b>. Dochte dürfen Schaden anrichten", "t": "0:12–0:24"}, {"r": "Höchster Körper im Swing High = dieser Schluss", "t": "0:24–0:28"}, {"r": "Späterer Lauf über die Körper, sticht in die CE, schafft den Docht nicht", "t": "0:28–0:35"}, {"r": "Rückwärts schauen: Wo ist die <b>erste FVG</b>? „Das ist die, die die Liquidität holt“", "t": "0:35–0:46"}], "ts": "0:05"}, {"name": "2026-11-16 – Intraday Pinball with Time and Price Grid", "datum": "2026-11-16", "titel": "Intraday Pinball with Time and Price Grid", "url": "https://www.youtube.com/watch?v=ufAdVwofeQ8", "kanal": "ICT Gems", "orig": "ICT Algorithmic Time & Price Grids (YouTube 4SJlJdIANCo)", "laenge": "20:13", "kern": "Teile die Daily-Lücke in Achtel und Viertel und zieh die Macro-Zeiten senkrecht ein. Eine 1-min-Lücke oder ein Order Block zählt nur, wenn er <b>auf einem dieser Niveaus verankert</b> ist. Die Richtung liest ICT an den Körpern: Bleiben sie in der richtigen Hälfte eines Dochts oder einer Lücke, läuft die Bewegung weiter.", "regeln": [], "ts": "2:50–3:02, 8:46–9:04"}, {"na t“ (2026-11-16 – Intraday Pinball with Time and Price Grid @ 8:46–9:04). Erster Stop an der CE in der Bibliothek.", "<b>NDOG bleibt aktiv:</b> Eine New Day Opening Gap ist nicht „one and done“, die letzten drei reichen. In Asien dreht der Preis an ihrer CE. Körper, die die CE nicht erreichen, zeigen Schwäche (bearish) (2026-11-11 – How to Know if the Session will be Trending or Consolidating @ 1:33–2:02, 5:10–5:30).", "<b>Stop-Variante Dochttief:</b> Nach einem CISD: Long in der oberen Dochthälfte bis zur CE, Stop am <b>Tief des Dochts</b> („frame your risk between … low of that wick to … your entry“). Im Pinball-Video dagegen Stop <b>unter der CE</b> (2026-11-06 – Wicks After a Change in the State of Delivery @ 0:45–0:58, 1:49–2:06).", "<b>Nicht verwechseln mit:</b> 50 % der Dealing Range (Equilibrium). Gleiche Idee, aber über eine ganze Range statt einer Lücke.", "<b>Quellen:</b> 2026-11-06 – Wicks After a Change in the State of Delivery @ 0:45–0:58, 1:49–2:06 · 2026-11-11 – How to Know if the Session will be Trending or Consolidating @ 1:33–2:02, 5:10–5:30 · 2026-11-16 – Intraday Pinball with Time and Price Grid @ 2:50–3:02, 8:46–9:04 · 2026-10-04 – FVG before a Stop Run using the Candle's Bodies @ 0:05 · 2024-08-10 – What makes a Price Range Balanced @ 0:17 · 2024-08-08 – ICT Explains True Fair Value Gaps @ 0:10, 0:15 · 2026-09-28 – Patchwork Inside A Fair Value Gap @ 0:20, 0:27, 0:34", "<b>Backtest:</b> ungetestet"], "unklar": [], "hash": "7fad0552", "lack": ["TP", "Zeitfenster", "Timeframes"], "extra": [], "quelle": "ICT Gems", "fragen": []}, {"id": "dealingrange", "name": "Dealing Range", "abk": "Dealing Range", "file": "Dealing Range", "aliases": ["Dealing Range", "Handelsspanne", "Equilibrium", "EQ", "Gleichgewicht", "Premium", "Discount", "Premium Discount"], "stufe": "Bias", "backtest": "ungetestet", "videos": [{"name": "2024-03-31 – Selecting the Right Swing Points for Dealing Ranges", "datum": "2024-03-31", "titel": "Selecting the Right Swing Points for Dealing Ranges", "url": "https://youtube.com/shorts/TtfmQAPkHuw", "kanal": "ICT Gems", "orig": "2022 ICT Mentorship Episode 35", "laenge": "0:29 (Short)", "kern": "Läuft eine Bewegung in <b>zwei Stufen</b> (Lauf, kleiner Rücklauf, zweiter Lauf), misst ICT die Dealing Range nur über die <b>letzte Stufe</b>: vom kurzfristigen Tief nach dem kleinen Rücklauf bis zum kurzfristigen Hoch. Die 50-%-Linie ist das Gleichgewicht, und er erwartet einen Rücklauf darunter in den Discount.", "regeln": [{"r": "Ein Abschnitt einer Bewegung kann Teil einer größeren Bewegung sein", "t": "0:00–0:05"}, {"r": "Die Abwärtsbewegung (Hoch → Tief) lief in <b>einem</b> Zug, die Aufwärtsbewegung in <b>zwei</b>", "t": "0:05–0:12"}, {"r": "Kleiner Rücklauf in der Mitte = zweite Stufe der Auslieferung", "t": "0:12–0:19"}, {"r": "„Ich nehme die <b>jüngste</b>“ Stufe: kurzfristiges Tief bis kurzfristiges Hoch = Dealing Range", "t": "0:19–0:25"}, {"r": "50 % = Gleichgewicht (Equilibrium); Erwartung: Rückfall in den <b>Discount</b>", "t": "0:25–0:29"}], "ts": "0:05, 0:12, 0:19, 0:25"}, {"name": "2024-03-03 – Early Signs of Market Reversal", "datum": "2024-03-03", "titel": "Early Signs of Market Reversal", "url": "https://youtube.com/shorts/iJD98tp27QY", "kanal": "ICT Gems", "orig": "2022 ICT Mentorship Episode 16", "laenge": "0:52 (Short)", "kern": "Frühe Umkehrzeichen im Daily: 1. Der Preis läuft über <b>relativ gleiche Hochs</b> (Buy-Side geholt). 2. Dann entsteht ein <b>Swing High</b>, sobald die nächste Tageskerze tiefer schließt.  Ab dann sucht ICT einen Short und erwartet am Folgetag <b>Power of Three</b>: Open, Rally, Abverkauf. Der Markt steht im <b>Premium</b>, und das Ziel ist der <b>bullische Order Block</b> weiter unten.", "regeln": [{"r": "Kürzlich über relativ gleiche Hochs gelaufen, dort lagen Buy-Stops/Buy-Side", "t": "0:00–0:07"}, {"r": "Über den Hochs ist Fortsetzung immer möglich", "t": "0:07–0:12"}, {"r": "Über gleiche Hochs, dann <b>Swing High</b>: Sobald diese Kerze schließt, s b> ungetestet"], "unklar": [], "hash": "4c99f49d", "lack": ["Entry", "SL", "TP", "Ungültig", "Zeitfenster", "Timeframes"], "extra": [], "quelle": "ICT Gems", "fragen": []}, {"id": "fvg", "name": "Fair Value Gap", "abk": "FVG", "file": "Fair Value Gap", "aliases": ["FVG", "Fair Value Gap", "Lücke", "Imbalance", "Patchwork", "Körper-Docht-Regel"], "stufe": "Entry", "backtest": "ungetestet", "videos": [{"name": "2024-08-08 – ICT Explains True Fair Value Gaps", "datum": "2024-08-08", "titel": "ICT Explains True Fair Value Gaps", "url": "https://youtube.com/shorts/sPyOWwKEsnU", "kanal": "ICT Gems", "orig": "ICT 2024 Mentorship – Lecture #2, 06.08.2024", "laenge": "0:24 (Short)", "kern": "Sticht ein Docht nur <b>bis zur Mitte (CE) oder weniger</b> in die Lücke, ignorierst du ihn. Die Kante der Lücke ziehst du dann an den <b>Körper</b> der Kerze. So bekommst du die „echte“ FVG.", "regeln": [{"r": "Gilt für eine FVG bzw. Imbalance, auch wenn ein <b>Volume Imbalance</b> darin liegt", "t": "0:00–0:04"}, {"r": "Ein Docht in der FVG hebt sie nicht auf, solange er <b>unter der CE</b> bleibt", "t": "0:04–0:13"}, {"r": "Jeder schwache Docht bis zur CE oder weniger: <b>ignorieren</b>", "t": "0:13–0:18"}, {"r": "„Take it to the body of the candle“ → das ergibt die <b>echte</b> FVG", "t": "0:18–0:24"}], "ts": "0:04, 0:13, 0:19"}, {"name": "2026-09-28 – Patchwork Inside A Fair Value Gap", "datum": "2026-09-28", "titel": "Patchwork Inside A Fair Value Gap", "url": "https://youtube.com/shorts/fS_OrvYSDbI", "kanal": "ICT Gems", "orig": "ICT 2026 Market Review – 08.04.2026", "laenge": "1:00 (Short)", "kern": "Eine Lücke (FVG) wird entweder <b>gefüllt</b> oder es entsteht <b>Patchwork</b> (Flickwerk). Soll sie offen bleiben, dürfen <b>Kerzenkörper nicht über die Mitte (CE)</b>, nur Dochte dürfen hineinstechen. Wird ein Teil der Lücke nur von einem einzigen Docht durchquert, zählt er so, als wäre er noch offen.", "regeln": [{"r": "Zwei Möglichkeiten: Die Lücke wird gefüllt, oder es entsteht Patchwork", "t": "0:00–0:06"}, {"r": "FVG = Tief der einen Kerze bis Hoch der anderen", "t": "0:05–0:09"}, {"r": "Soll die Lücke offen bleiben: Körper dürfen nicht in die obere Hälfte. Das ist „institutional order flow“", "t": "0:09–0:23"}, {"r": "Körper bleiben draußen, Dochte dürfen antippen, Körper erreichen die CE nicht", "t": "0:23–0:29"}, {"r": "„Nur die Dochte dürfen das“", "t": "0:29–0:36"}, {"r": "Nur Körper betrachtet: Zwischen Kerzenhoch und dem höchsten Open/Close bleibt eine kleine Trennung. Die wird nur von einem Docht durchquert, und das ist so, als gäbe es gar keinen Docht", "t": "0:38–0:54"}, {"r": "Stärker, wenn gar kein Kerzenteil (Docht oder Körper) in der Lücke ist", "t": "0:55–1:00"}], "ts": "0:00, 0:05, 0:15, 0:25, 0:40, 0:55"}, {"name": "2024-04-15 – New Silver Bullet Unlocked", "datum": "2024-04-15", "titel": "New Silver Bullet Unlocked", "url": "https://youtube.com/shorts/6615y6_gcVs", "kanal": "ICT Gems", "orig": "ICT Mentorship 2023 – Market Maker Models", "laenge": "0:36 (Short)", "kern": "Das <b>2022 Model</b> in einem Satz: Buy-Side genommen, Marktstruktur dreht (MSS), FVG, Short. Der Rücklauf in die FVG zwischen <b>07:00 und 09:00 NY</b> nennt ICT ebenfalls einen Silver Bullet („NY Open Kill Zone“), denn „ich habe ein ganzes Regal voller Silver Bullets“. FVGs bilden sich ständig. Entscheidend ist die Geschichte (Narrativ) der Session.", "regeln": [{"r": "2022 Model: Buy-Side genommen → MSS → FVG → Short", "t": "0:00–0:07"}, {"r": "Der Rücklauf in die FVG ist der Silver Bullet der <b>NY Open Kill Zone 07:00–09:00</b>", "t": "0:07–0:15"}, {"r": "Es gibt viele Silver Bullets („a whole rack“)", "t": "0:15–0:19"}, {"r": "FVGs bilden sich ständig. Du musst das Narrativ der Session kennen", "t": "0:19–0:27"}, {"r": "Er nutzt Tageszeiten mit viel Volumen, wenn der Order Flow schnell zunimmt", "t": "0:27–0:36"}], "ts": "0:20"}, {"name": "2026-10-04 – FVG before a Stop Run using the Candle's Bodies", "datum": "2026-10-04", "titel": "FVG before a Stop Run using the Candle's Bodies", "url": "https://youtube.com/shorts/CRYwiM3UdZI", "kanal": "ICT Gems", "orig": "ICT 2026 Market Commentary – 06.04.2026", "laenge": "0:46 (Short)", "kern": "- <b>Dochte behandelt ICT wie eine Lücke</b> und hat dafür eine eigene Mitte (CE). - Den Swing High liest er an den <b>Körpern</b>: „Die Körper zeigen das echte Volumen, Dochte dürfen Schaden anrichten.“ - Läuft der Preis später über das Körper-Hoch und sticht in die CE des Dochts, schafft aber den Docht nicht, schau <b>rückwärts</b>. Die <b>erste FVG</b> vor diesem Lauf ist die, die die Liquidität geholt hat.", "regeln": [{"r": "Buy-Side wurde mit diesem Docht geholt", "t": "0:00–0:04"}, {"r": "Was machen wir mit Dochten? <b>Wie eine Lücke behandeln</b> → CE", "t": "0:04–0:07"}, {"r": "Schluss darüber, aber die oberen Level nicht erreicht → Rücklauf, dann Abverkauf", "t": "0:07–0:12"}, {"r": "Der Docht gehört zum Lauf, aber <b>die Körper zeigen das echte Volumen</b>. Dochte dürfen Schaden anrichten", "t": "0:12–0:24"}, {"r": "Höchster Körper im Swing High = dieser Schluss", "t": "0:24–0:28"}, {"r": "Späterer Lauf über die Körper, sticht in die CE, schafft den Docht nicht", "t": "0:28–0:35"}, {"r": "Rückwärts schauen: Wo ist die <b>erste FVG</b>? „Das ist die, die die Liquidität holt“", "t": "0:35–0:46"}], "ts": "0:19"}, {"name": "2026-10-02 – Volume Imbalances in between FVGs", "datum": "2026-10-02", "titel": "Volume Imbalances in between FVGs", "url": "https://youtube.com/shorts/E6Kl7lzN9Uw", "kanal": "ICT Gems", "orig": "ICT 2026 Smart Money Concepts Lecture – 29.01.2026", "laenge": "0:32 (Short)", "kern": "Folgen beim Abverkauf <b>SIBI → Volume Imbalance → weitere Abwärtskerze</b> aufeinander, zeichnest du nicht nur die einzelnen Lücken ein (das ist „nicht technisch falsch“). Du <b>fasst alles zu einer Zone zusammen</b>, vom Tief der ersten Kerze bis zum Ende der letzten Lücke. Nur so bekommst du „die volle Spanne und die Präzision“.", "regeln": [{"r": "Das ist ein weit ting @ 5:38–6:55). Stop nicht genannt.", "<b>Am Market on Close:</b> Bullishe FVG wird unterschritten → IFVG. In den letzten Minuten der letzten Stunde fällt der Preis, läuft genau zurück in die IFVG und dreht (2026-11-06 – Wicks After a Change in the State of Delivery @ 2:23–3:13). Stop nicht genannt.", "<b>Nicht verwechseln mit:</b> Balanced Price Range (hoch <b>und</b> runter durch dieselbe Zone, ohne Bruch-Logik).", "<b>Quellen:</b> 2026-11-06 – Wicks After a Change in the State of Delivery @ 2:23–3:13 · 2026-11-11 – How to Know if the Session will be Trending or Consolidating @ 5:38–6:55 · 2026-11-16 – Intraday Pinball with Time and Price Grid @ 11:31–12:04, 15:23, 16:30 · 2024-01-28 – ICT Teaches how to Scalp Every 1 Hour Candle (Macros) @ 1:31–2:07, 2:25, 2:42–2:58 · 2025-09-19 – Master Venom Model in 20 Seconds (Bild)", "<b>Backtest:</b> ungetestet"], "unklar": [], "hash": "a299a1a5", "lack": [], "extra": [], "quelle": "ICT Gems", "fragen": []}, {"id": "ob", "name": "Order Block", "abk": "OB", "file": "Order Block", "aliases": ["OB", "Order Block", "Orderblock", "+OB", "-OB", "Bullish Order Block", "Bearish Order Block", "Mehrkerzen-OB"], "stufe": "Entry", "backtest": "ungetestet", "videos": [{"name": "2025-09-25 – What is an Order Block", "datum": "2025-09-25", "titel": "What is an Order Block", "url": "https://youtube.com/shorts/COp1-XHzJUk", "kanal": "URAH ICT (nicht der Kanal ICT Gems)", "orig": "nicht angegeben", "laenge": "0:18 (Short)", "kern": "Bearish Order Block = die <b>letzte grüne Kerze vor dem Abverkauf</b>. Das Displacement danach ist der „Wechsel der Lieferrichtung“. Der <b>Eröffnungskurs</b> dieser Kerze ist ICTs Order Block. Mit einer „FU-Kerze“ oder anderen neuen Namen hat das nichts zu tun.", "regeln": [{"r": "Letzte grüne Kerze vor dieser Abwärtsbewegung", "t": "0:00–0:04"}, {"r": "Dieses Displacement = Wechsel der Lieferrichtung („change in the state of delivery“)", "t": "0:04–0:06"}, {"r": "Der <b>Eröffnungskurs</b> ist mein ICT Order Block", "t": "0:06–0:09"}, {"r": "Hat nichts mit einer „FU-Kerze“ zu tun, keine neuen Namen", "t": "0:09–0:18"}], "ts": "0:06"}, {"name": "2025-10-28 – Identifying ICT Type of Order Block", "datum": "2025-10-28", "titel": "Identifying ICT Type of Order Block", "url": "https://youtube.com/shorts/E2qremjHrys", "kanal": "URAH ICT (nicht der Kanal ICT Gems)", "orig": "nicht angegeben", "laenge": "0:24 (Short)", "kern": "Ein kurzfristiges Hoch wird geholt, dann läuft der Preis zurück <b>in eine rote Kerze</b>, den möglichen bullischen Order Block. Die Frage ist: Stützt sie den Preis? Entscheidend ist der <b>Mean Threshold</b>, also die <b>Mitte dieser roten Kerze</b>. Hält der Preis dort, ist der OB bestätigt. „Ich muss nichts einzeichnen, man sieht es.“", "regeln": [{"r": "Das kurzfristige Hoch wird geholt", "t": "0:00–0:03"}, {"r": "Preis läuft zurück in eine rote Kerze = möglicher bullischer OB", "t": "0:03–0:09"}, {"r": "Stützt sie den Preis?", "t": "0:10–0:13"}, {"r": "<b>Mean Threshold</b> = Mitte dieser roten Kerze, dort wird der Preis gestützt", "t": "0:13–0:20"}, {"r": "Nichts einzeichnen nötig, man sieht es. „Ja, tut sie“", "t": "0:20–0:24"}], "ts": "0:13"}, {"name": "2024-06-18 – When to Use Consecutive Candles for an Orderblock", "datum": "2024-06-18", "titel": "When to Use Consecutive Candles for an Orderblock", "url": "https://youtube.com/shorts/WZScsy-jFz4", "kanal": "ICT Gems", "orig": "ICT 2023 Mentorship Analysis – 25.01.2023", "laenge": "0:36 (Short)", "kern": "Ein Order Block sind die Kerzen, die <b>gegen den Order Flow</b> schließen. Bei bullischem Order Flow sind das die roten Kerzen. Ist es nur eine rote Kerze, nimmst du diese eine. Ist es eine <b>Serie roter Kerzen</b> und der Preis läuft stark durch sie hindurch, nimmst du <b>alle</b>: Hoch der ersten roten Kerze nach rechts verlängern. Liegt dort eine Lücke, ist das der OB.", "regeln": [{"r": "FVG mit Order Block: Preis läuft hinein und steigt. Order Blocks werden durchschnitten", "t": "0:00–0:05"}, {"r": "Kleiner Order Block, Anstieg, nächster Order Block", "t": "0:05–0:09"}, {"r": "Warum mal nur <b>eine</b> Kerze, mal <b>alle</b> Kerzen?", "t": "0:09–0:13"}, {"r": "Weil all diese Kerzen <b>gegen den Order Flow</b> laufen, und der ist bullisch", "t": "0:13–0:18"}, {"r": "Serie roter Kerzen + starker Lauf hindurch → zurück zum <b>Hoch der ersten Kerze</b>, nach rechts verlängern → Imbalance = OB", "t": "0:18–0:28"}, {"r": "„Möglicher“ OB, aber er will ihn nicht, weil der Körper einer anderen Kerze tiefer reicht", "t": "0:28–0:33"}, {"r": "„Es gibt Regeln, es gibt Stufen bei all dem“", "t": "0:33–0:36"}], "ts": "0:00, 0:09, 0:15, 0:20, 0:30"}, {"name": "2024-04-15 – New Silver Bullet Unlocked", "datum": "2024-04-15", "titel": "New Silver Bullet Unlocked", "url": "https://youtube.com/shorts/6615y6_gcVs", "kanal": "ICT Gems", "orig": "ICT Mentorship 2023 – Market Maker Models", "laenge": "0:36 (Short)", "kern": "Das <b>2022 Model</b> in einem Satz: Buy-Side genommen, Marktstruktur dreht (MSS), FVG, Short. Der Rücklauf in die FVG zwischen <b>07:00 und 09:00 NY</b> nennt ICT ebenfalls einen Silver Bullet („NY Open Kill Zone“), denn „ich habe ein ganzes Regal voller Silver Bullets“. FVGs bilden sich ständig. Entscheidend ist die Geschichte (Narrativ) der Session.", "regeln": [{"r": "2022 Model: Buy-Side genommen → MSS → FVG → Short", "t": "0:00–0:07"}, {"r": "Der Rücklauf in die FVG ist der Silver Bullet der <b>NY Open Kill Zone 07:00–09:00</b>", "t": "0:07–0:15"}, {"r": "Es gibt viele Silver Bullets („a whole rack“)", "t": "0:15–0:19"}, {"r": "FVGs bilden sich ständig. Du musst das Narrativ der Session kennen", "t": "0:19–0:27"}, {"r": "Er nutzt Tageszeiten mit viel Volumen, wenn der Order Flow schnell zunimmt", "t": "0:27–0:36"}], "ts": ""}, {"name": "2024-03-03 – Early Signs of Market Reversal", "datum": "2024-03-03", "titel": "Early Signs of Market Reversal", "url": "https://youtube.com/shorts/iJD98tp27QY", "kanal": "ICT Gems", "orig": "2022 ICT Mentorship Episode 16", "laenge": "0:52 (Short)", "kern": "Frühe Umkehrzeichen im Daily: 1. Der Preis läuft über <b>relativ gleiche Hochs</b> (Buy-Side geholt). 2. Dann entsteht ein <b>Swing High</b>, sobald die nächste Tageskerze tiefer schließt.  Ab dann sucht ICT einen Short und erwartet am Folgetag <b>Power of Three</b>: Open, Rally, Abverkauf. Der Markt steht im <b>Premium</b>, und das Ziel ist der <b>bullische Order Block</b> weiter unten.", "regeln": [{"r": "Kürzlich über relativ gleiche Hochs gelaufen, dort lagen Buy-Stops/Buy-Side", "t": "0:00–0:07"}, {"r": "Über den Hochs ist Fortsetzung immer möglich", "t": "0:07–0:12"}, {"r": "Über gleiche Hochs, dann <b>Swing High</b>: Sobald diese Kerze schließt, sucht er am nächsten Tag einen Short", "t": "0:12–0:22"}, {"r": "Erwartung: Open, Rally, „Power of Three“ = Accumulation, Manipulation, Distribution", "t": "0:22–0:30"}, {"r": "Nächste Ebene: Premium oder Discount? Hier <b>Premium</b>, über alten Hochs, „weit gestreckt“", "t": "0:30–0:41"}, {"r": "Geht es runter, ist <b>diese rote Kerze dein bullischer Order Block</b>. Der Lauf dorthin ist „favorable“", "t": "0:41–0:52"}], "ts": "0:44"}, {"name": "2026-11-06 – Wicks After a Change in the State of Delivery", "datum": "2026-11-06", "titel": "Wicks After a Change in the State of Delivery", "url": "https://www.youtube.com/watch?v=8rE4LzA4O-c", "kanal": "ICT Gems", "orig": "Futures Market Review – Lecture On Shadows Validating PD Arrays (YouTube pq9WuZ9q4Bg)", "laenge": "3:27", "kern": "Nach einer Serie Abwärtskerzen holt der Preis die Tiefs und handelt über den Eröffnungspreis der größten Kerze. Das ist der Richtungswechsel (CISD). Beim Rücklauf entsteht ein Docht: In seiner oberen Hälfte bis zur Mitte kaufen, Stop am Dochttief.", "regeln": [], "ts": "0:19–0:33, 1:38"}, {"name": "2024-01-28 – ICT Teaches how to Scalp Every 1 Hour Candle (Macros)", "datum": "2024-01-28", "titel": "ICT Teaches how to Scalp Every 1 Hour Candle (Macros)", "url": "https://youtu.be/-dAwaexfn5c", "k stieg). <i>Deutung</i>, im Video nicht gezeigt.", "<b>Nicht verwechseln mit:</b> Time Distortion. Dort ist die Seitwärtsphase reines Warten, hier ist sie Teil A eines Tagesablaufs.", "<b>Quellen:</b> 2024-03-03 – Early Signs of Market Reversal @ 0:22–0:30", "<b>Backtest:</b> ungetestet"], "unklar": [], "hash": "c6c8dee4", "lack": ["Entry (nur Deutung)", "SL", "Ungültig", "Zeitfenster"], "extra": [], "quelle": "ICT Gems", "fragen": []}, {"id": "sibi", "name": "Sell-side Imbalance Buy-side Inefficiency", "abk": "SIBI", "file": "Sell-side Imbalance Buy-side Inefficiency", "aliases": ["SIBI", "SIBI-Lücke", "Sell-side Imbalance Buy-side Inefficiency", "bärische FVG", "Bearish FVG"], "stufe": "Entry", "backtest": "ungetestet", "videos": [{"name": "2024-06-18 – When to Expect an IOFED", "datum": "2024-06-18", "titel": "When to Expect an IOFED", "url": "https://youtube.com/shorts/Qmd79rOItnI", "kanal": "ICT Gems", "orig": "ICT Mentorship 2023 – Market Review & Commentary", "laenge": "0:34 (Short)", "kern": "Liegen <b>zwei Lücken (SIBI) dicht übereinander</b>, tippt der Preis die zweite nur kurz an und läuft weiter – das ist ein <b>IOFED</b>. Gibt es nur <b>eine</b> Lücke, erwartet ICT einen <b>tieferen</b> Rücklauf hinein. Das gibt es auf allen Timeframes, entscheidend ist der Kontext (wohin will der Markt?).", "regeln": [{"r": "Preis läuft zurück in die SIBI und sticht mit dem Docht darüber hinaus – „völlig zulässig“", "t": "0:03–0:10"}, {"r": "Danach Abverkauf, neue Lücke. Preis handelt nur „ein kleines Stück“ über die Kerze hinein = IOFED", "t": "0:10–0:17"}, {"r": "Gibt es auf allen Timeframes – aber man muss wissen, wohin der Markt wahrscheinlich will", "t": "0:17–0:22"}, {"r": "<b>Zwei Lücken dicht beieinander</b> machen es zum IOFED", "t": "0:22–0:29"}, {"r": "Wäre da nur eine Lücke, würde er erwarten, dass der Preis <b>tiefer in die Lücke</b> läuft", "t": "0:29–0:34"}], "ts": "0:03, 0:08"}, {"name": "2026-09-28 – Patchwork Inside A Fair Value Gap", "datum": "2026-09-28", "titel": "Patchwork Inside A Fair Value Gap", "url": "https://youtube.com/shorts/fS_OrvYSDbI", "kanal": "ICT Gems", "orig": "ICT 2026 Market Review – 08.04.2026", "laenge": "1:00 (Short)", "kern": "Eine Lücke (FVG) wird entweder <b>gefüllt</b> oder es entsteht <b>Patchwork</b> (Flickwerk). Soll sie offen bleiben, dürfen <b>Kerzenkörper nicht über die Mitte (CE)</b>, nur Dochte dürfen hineinstechen. Wird ein Teil der Lücke nur von einem einzigen Docht durchquert, zählt er so, als wäre er noch offen.", "regeln": [{"r": "Zwei Möglichkeiten: Die Lücke wird gefüllt, oder es entsteht Patchwork", "t": "0:00–0:06"}, {"r": "FVG = Tief der einen Kerze bis Hoch der anderen", "t": "0:05–0:09"}, {"r": "Soll die Lücke offen bleiben: Körper dürfen nicht in die obere Hälfte. Das ist „institutional order flow“", "t": "0:09–0:23"}, {"r": "Körper bleiben draußen, Dochte dürfen antippen, Körper erreichen die CE nicht", "t": "0:23–0:29"}, {"r": "„Nur die Dochte dürfen das“", "t": "0:29–0:36"}, {"r": "Nur Körper betrachtet: Zwischen Kerzenhoch und dem höchsten Open/Close bleibt eine kleine Trennung. Die wird nur von einem Docht durchquert, und das ist so, als gäbe es gar keinen Docht", "t": "0:38–0:54"}, {"r": "Stärker, wenn gar kein Kerzenteil (Docht oder Körper) in der Lücke ist", "t": "0:55–1:00"}], "ts": "0:25"}, {"name": "2024-08-08 – ICT Explains True Fair Value Gaps", "datum": "2024-08-08", "titel": "ICT Explains True Fair Value Gaps", "url": "https://youtube.com/shorts/sPyOWwKEsnU", "kanal": "ICT Gems", "orig": "ICT 2024 Mentorship – Lecture #2, 06.08.2024", "laenge": "0:24 (Short)", "kern": "Sticht ein Docht nur <b>bis zur Mitte (CE) oder weniger</b> in die Lücke, ignorierst du ihn. Die Kante der Lücke ziehst du dann an den <b>Körper</b> der Kerze. So bekommst du die „echte“ FVG.", "regeln": [{"r": "Gilt für eine FVG bzw. Imbalance, auch wenn ein <b>Volume Imbalance</b> darin liegt", "t": "0:00–0:04"}, {"r": "Ein Docht in der FVG hebt sie nicht auf, solange er <b>unter der CE</b> bleibt", "t": "0:04–0:13"}, {"r": "Jeder schwache Docht bis zur CE oder weniger: <b>ignorieren</b>", "t": "0:13–0:18"}, {"r": "„Take it to the body of the candle“ → das ergibt die <b>echte</b> FVG", "t": "0:18–0:24"}], "ts": "0:23"}, {"name": "2026-10-02 – Volume Imbalances in between FVGs", "datum": "2026-10-02", "titel": "Volume Imbalances in between FVGs", "url": "https://youtube.com/shorts/E6Kl7lzN9Uw", "kanal": "ICT Gems", "orig": "ICT 2026 Smart Money Concepts Lecture – 29.01.2026", "laenge": "0:32 (Short)", "kern": "Folgen beim Abverkauf <b>SIBI → Volume Imbalance → weitere Abwärtskerze</b> aufeinander, zeichnest du nicht nur die einzelnen Lücken ein (das ist „nicht technisch falsch“). Du <b>fasst alles zu einer Zone zusammen</b>, vom Tief der ersten Kerze bis zum Ende der letzten Lücke. Nur so bekommst du „die volle Spanne und die Präzision“.", "regeln": [{"r": "Das ist ein weiteres PD-Array: Kerzentief, Abverkauf, Volume Imbalance, dann weiter SIBI", "t": "0:00–0:09"}, {"r": "Normalerweise zeichnet man es einzeln, und das ist <b>nicht technisch falsch</b>", "t": "0:09–0:17"}, {"r": "Aber: verlässt Kerzentief → SIBI → Volume Imbalance → noch eine Abwärtskerze…", "t": "0:17–0:26"}, {"r": "…dann musst du <b>das Ganze umschließen</b>, um volle Spanne und Präzision zu bekommen", "t": "0:26–0:32"}], "ts": "0:20"}], "satz": "Eine <b>Lücke nach unten</b>: Der Preis fällt so schnell, dass zwischen den Kerzen ein Bereich ohne Handel bleibt – dahin kommt er oft zurück.", "svg": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MDAgMjkwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIEFyaWFsLCBzYW5zLXNlcmlmIiB4bWxuczpjMnBhPSJodHRwOi8vYzJwYS5vcmcvbWFuaWZlc3QiPgogIDxyZWN0IHg9IjAiIHk9IjAiIHdpZHRoPSI3MDAiIGhlaWdodD0iMjkwIiByeD0iMTQiIGZpbGw9IiNmYWZhZjciLz4KICA8dGV4dCB4PSIyMCIgeT0iMjgiIGZvbnQtc2l6ZT0iMTUiIGZpbGw9IiMyMjIiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC13ZWlnaHQ9IjcwMCI+U0lCSTogTMO8Y2tlIG5hY2ggZWluZXIgc3RhcmtlbiByb3RlbiBLZXJ6ZTwvdGV4 8–0:14"}, {"r": "Noch ein kleinerer Versuch, tiefer als dieser Tag zu gehen, und es klappt", "t": "0:14–0:17"}, {"r": "Am Folgetag: Open, runter, wieder hoch", "t": "0:17–0:21"}, {"r": "„Das ist ein Swing …“ (bricht ab)", "t": "0:21–0:23"}], "ts": "0:03, 0:10, 0:15, 0:19"}, {"name": "2024-03-03 – Early Signs of Market Reversal", "datum": "2024-03-03", "titel": "Early Signs of Market Reversal", "url": "https://youtube.com/shorts/iJD98tp27QY", "kanal": "ICT Gems", "orig": "2022 ICT Mentorship Episode 16", "laenge": "0:52 (Short)", "kern": "Frühe Umkehrzeichen im Daily: 1. Der Preis läuft über <b>relativ gleiche Hochs</b> (Buy-Side geholt). 2. Dann entsteht ein <b>Swing High</b>, sobald die nächste Tageskerze tiefer schließt.  Ab dann sucht ICT einen Short und erwartet am Folgetag <b>Power of Three</b>: Open, Rally, Abverkauf. Der Markt steht im <b>Premium</b>, und das Ziel ist der <b>bullische Order Block</b> weiter unten.", "regeln": [{"r": "Kürzlich über relativ gleiche Hochs gelaufen, dort lagen Buy-Stops/Buy-Side", "t": "0:00–0:07"}, {"r": "Über den Hochs ist Fortsetzung immer möglich", "t": "0:07–0:12"}, {"r": "Über gleiche Hochs, dann <b>Swing High</b>: Sobald diese Kerze schließt, sucht er am nächsten Tag einen Short", "t": "0:12–0:22"}, {"r": "Erwartung: Open, Rally, „Power of Three“ = Accumulation, Manipulation, Distribution", "t": "0:22–0:30"}, {"r": "Nächste Ebene: Premium oder Discount? Hier <b>Premium</b>, über alten Hochs, „weit gestreckt“", "t": "0:30–0:41"}, {"r": "Geht es runter, ist <b>diese rote Kerze dein bullischer Order Block</b>. Der Lauf dorthin ist „favorable“", "t": "0:41–0:52"}], "ts": "0:15"}, {"name": "2026-10-04 – FVG before a Stop Run using the Candle's Bodies", "datum": "2026-10-04", "titel": "FVG before a Stop Run using the Candle's Bodies", "url": "https://youtube.com/shorts/CRYwiM3UdZI", "kanal": "ICT Gems", "orig": "ICT 2026 Market Commentary – 06.04.2026", "laenge": "0:46 (Short)", "kern": "- <b>Dochte behandelt ICT wie eine Lücke</b> und hat dafür eine eigene Mitte (CE). - Den Swing High liest er an den <b>Körpern</b>: „Die Körper zeigen das echte Volumen, Dochte dürfen Schaden anrichten.“ - Läuft der Preis später über das Körper-Hoch und sticht in die CE des Dochts, schafft aber den Docht nicht, schau <b>rückwärts</b>. Die <b>erste FVG</b> vor diesem Lauf ist die, die die Liquidität geholt hat.", "regeln": [{"r": "Buy-Side wurde mit diesem Docht geholt", "t": "0:00–0:04"}, {"r": "Was machen wir mit Dochten? <b>Wie eine Lücke behandeln</b> → CE", "t": "0:04–0:07"}, {"r": "Schluss darüber, aber die oberen Level nicht erreicht → Rücklauf, dann Abverkauf", "t": "0:07–0:12"}, {"r": "Der Docht gehört zum Lauf, aber <b>die Körper zeigen das echte Volumen</b>. Dochte dürfen Schaden anrichten", "t": "0:12–0:24"}, {"r": "Höchster Körper im Swing High = dieser Schluss", "t": "0:24–0:28"}, {"r": "Späterer Lauf über die Körper, sticht in die CE, schafft den Docht nicht", "t": "0:28–0:35"}, {"r": "Rückwärts schauen: Wo ist die <b>erste FVG</b>? „Das ist die, die die Liquidität holt“", "t": "0:35–0:46"}], "ts": "0:24"}], "satz": "Drei Tageskerzen, bei denen die mittlere das tiefste Tief (Swing Low) oder das höchste Hoch (Swing High) hat. Erst wenn die dritte Kerze sich wegbewegt, ist der Swing bestätigt.", "svg": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MDAgMzYwIiBmb250LWZhbWlseT0iU2Vnb2UgVUksIEFyaWFsLCBzYW5zLXNlcmlmIiB4bWxuczpjMnBhPSJodHRwOi8vYzJwYS5vcmcvbWFuaWZlc3QiPgogIDxyZWN0IHg9IjAiIHk9IjAiIHdpZHRoPSI3MDAiIGhlaWdodD0iMzYwIiByeD0iMTQiIGZpbGw9IiNmYWZhZjciLz4KICA8dGV4dCB4PSIyMCIgeT0iMjgiIGZvbnQtc2l6ZT0iMTQiIGZpbGw9IiMyMjIiIHRleHQtYW5jaG9yPSJzdGFydCIgZm9udC13ZWlnaHQ9IjcwMCI+U3dpbmcgTG93IGltIERhaWx5OiBTZWxsLVNpZGUgZ2Vob2x0IOKGkiBtaXR0bGVyZSBLZXJ6ZSB0aWVmc3RlcyBUaWVmIOKGkiBFcmhvbHVuZzwvdGV4dD4KICA8dGV4dCB4PSIyMCIgeT0iNDciIGZvbnQtc2l6ZT0iMTEiIGZpbGw9IiM3NzciIHRleHQtYW5jaG9yPSJzdGFydCI+VGFnZXNrZXJ6ZW4gwrcgU2NoZW1hLCBrZWluIGVjaHRlciBDaGFydDwvdGV4dD4KIC /* Zeit: Plan-Fenster sind NY-Zeit, Anzeige in Europe/Berlin */
function tz(zone){const p=new Intl.DateTimeFormat('en-GB',{timeZone:zone,hour:'2-digit',minute:'2-digit',weekday:'short',hourCycle:'h23'}).formatToParts(new Date());const g=t=>p.find(x=>x.type===t).value;return{min:(+g('hour'))*60+(+g('minute')),wd:g('weekday')}}
const toMin = s => {const [h,m]=s.split(':').map(Number);return h*60+m};
const fmt = m => {m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const dur = m => m>=60?Math.floor(m/60)+' h '+(m%60)+' min':m+' min';
function timeCtx(){
  const ny=tz('America/New_York'), be=tz('Europe/Berlin');
  const off=((be.min-ny.min)%1440+1440)%1440;
  const wk=!['Sat','Sun'].includes(ny.wd);
  const wins=D.plan.windows.map(w=>({...w,a:toMin(w.from),b:toMin(w.to)}));
  const active=wk?wins.find(w=>ny.min>=w.a&&ny.min<w.b):null;
  let next=null,inMin=null;
  if(wk){const n=wins.find(w=>ny.min<w.a);if(n){next=n;inMin=n.a-ny.min}}
  if(!next){next=wins[0];const days=ny.wd==='Fri'?3:ny.wd==='Sat'?2:1;inMin=days*1440-ny.min+next.a; if(!wk&&ny.wd==='Sun'){inMin=1440-ny.min+next.a}}
  return{ny,be,off,wk,active,next,inMin};
}
/* Karten-Fenster zählen nur innerhalb der Plan-Fenster (Plan gilt). Karte nennt keine Zeit -> Plan-Fenster. */
const inPlan = ([a,b]) => D.plan.windows.some(w=>toMin(a)<toMin(w.to)&&toMin(b)>toMin(w.from));
function conceptActive(c,t){
  if(!t.active)return false;
  if(c.windows&&c.windows.length){return c.windows.some(([a,b])=>t.ny.min>=toMin(a)&&t.ny.min<toMin(b))}
  return true;
}
function renderClock(){
  const t=timeCtx();
  $('#clock').innerHTML='Berlin '+fmt(t.be.min)+'<br>NY '+fmt(t.ny.min);
  const box=$('#now');box.className='now'+(t.active?(t.active.name==='NY PM'?' aplus':' on'):'');
  if(t.active){
    $('#nowT').textContent=t.active.name+' läuft · bis '+fmt(t.active.b+t.off)+' Berlin';
    $('#nowS').textContent=(t.active.note?t.active.note+' · ':'')+'Plan: '+D.plan.hinweise[0];
  }else{
    $('#nowT').textContent='Kein Plan-Fenster';
    $('#nowS').textContent='Nächstes: '+t.next.name+' '+fmt(t.next.a+t.off)+'–'+fmt(t.next.b+t.off)+' Berlin (in '+dur(t.inMin)+') · '+D.plan.hinweise[1];
  }
  return t;
}

function badges(c){
  const bt={ungetestet:'Backtest: ungetestet','läuft':'Backtest: läuft',getestet:'Backtest: getestet'}[c.backtest]||('Backtest: '+c.backtest);
  const pl=c.plan==='passt'?(c.planBedingt?'Plan: passt (bedingt)':'Plan: passt'):c.plan==='passt nicht'?'Plan: passt nicht':'Plan: ⚠️ unklar';
  return '<span class="bdg bt-'+esc(c.backtest)+'">'+bt+'</span><span class="bdg pl-'+c.plan.replace(' ','')+'">'+pl+'</span>';
}
function visible(){
  const t=timeCtx(), q=norm(state.q);
  return D.concepts.filter(c=>{
    if(q){return [c.name,c.abk,c.file,...c.aliases].some(x=>norm(x).includes(q))}
    if(!state.all&&c.plan==='passt nicht')return false;
    if(state.now&&!conceptActive(c,t))return false;
    return true;
  });
}

  if(!vis.length){
    html='<div class="empty">'+(state.q?'Kein Konzept zu „'+esc(state.q)+'“.':state.now?'Jetzt passt kein Konzept: kein Plan-Fenster.<br>Nächstes: '+t.next.name+' '+fmt(t.next.a+t.off)+' Berlin.':'Keine Konzepte sichtbar.')+'</div>';
  }else if(empty.length&&!state.q&&!state.now){html+='<div class="emptyst">Noch keine Karte: '+esc(empty.join(' · '))+'</div>'}

/* Rückfrage an Claude: in der claude.ai-Vorschau direkt (sample), in der installierten App über claude.ai */
const askSample=(window.claude&&typeof window.claude.use==='function')?window.claude.use('sample').catch(()=>null):Promise.resolve(null);
const askChats={};
const plainTxt=h=>String(h||'').replace(/<span class="tag-d">[^<]*<\/span>/g,'[Deutung] ').replace(/<span class="tag-p">[^<]*<\/span>/g,'[Mein Plan] ').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&amp;/g,'&');
function cardText(c){
  const T=c.trade,f=k=>{const x=T[k];if(!x||!x.html)return 'fehlt in Karte';return (x.missing?'fehlt in Karte · ':'')+plainTxt(x.html)};
  const L=['KARTE: '+c.name+' ('+c.abk+') · Stufe '+c.stufe+' · Backtest: '+c.backtest+' · Quelle: '+c.quelle];
  if(c.satz)L.push('In einem Satz: '+plainTxt(c.satz));
  if(c.steps.length)L.push('So läuft es ab:\n'+c.steps.map(s=>s.n+'. '+plainTxt(s.name)+' – '+plainTxt(s.see)).join('\n')+(c.stepsNote.length?'\n'+c.stepsNote.map(plainTxt).join('\n'):''));
  if(c.checks.length)L.push('Checkliste:\n'+c.checks.map(x=>'- '+plainTxt(x)).join('\n'));
  L.push('Trade: Entry: '+f('entry')+' | SL: '+f('sl')+' | TP: '+f('tp')+' | Ungültig wenn: '+f('inv'));
  if(c.zeitNotes.length)L.push('Zeit & Timeframes:\n'+c.zeitNotes.map(x=>'- '+plainTxt(x)).join('\n'));
  if(c.planLines.length)L.push('Passt zu meinem Plan?\n'+c.planLines.map(plainTxt).join('\n'));
  if(c.unklar.length)L.push('Unklar in der Karte:\n'+c.unklar.map(x=>'- '+plainTxt(x)).join('\n'));
  (c.extra||[]).forEach(x=>{if(x.items.length)L.push(plainTxt(x.title)+':\n'+x.items.map(i=>'- '+plainTxt(i)).join('\n'))});
  if(c.details.length)L.push('Details:\n'+c.details.map(x=>'- '+plainTxt(x)).join('\n'));
  if(c.video.length)L.push('Aus dem Video: '+c.video.map(plainTxt).join(' '));
  return L.join('\n\n').slice(0,7000);
}
const askRules=c=>'Du bist die Lernhilfe in Andrejs ICT-Gems-App (Trading NASDAQ, Konzepte des Traders ICT). Er schaut gerade auf die Konzept-Karte unten und hat eine Rückfrage.\n\nREGELN\n'+
  '- Deutsch, Du-Form, einfach und kurz: höchstens 8 Sätze oder 5 Stichpunkte. Fachwörter in einfachen Worten erklären.\n'+
  '- Stütze dich auf die Karte. Was nicht in der Karte steht, markierst du mit „⚠️ nicht aus der Karte“. Erfinde keine Regeln, Zahlen, Uhrzeiten oder Zitate.\n'+
  '- [Deutung] in der Karte ist Auslegung, nicht ICTs Aussage. Sag das, wenn es für die Antwort zählt.\n'+
  '- Keine Kauf- oder Verkaufssignale, nichts zum aktuellen Markt. Die App ist ein Abgleich-Werkzeug, kein Signalgeber.\n'+
  '- Berührt die Frage seinen Trading-Plan, gelten: '+D.plan.hinweise.join(' ')+' Fenster NY AM 09:30–11:00, NY PM 13:30–16:00 nur A+.\n'+
  '- Kann die Karte die Frage nicht beantworten, sag das klar und nenne, was fehlt.\n\n'+cardText(c);
const fmtAns=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
async function setupAsk(c){
  const go=$('#askGo'),q=$('#askQ'),log=$('#askLog'),note=$('#askNote');
  if(!go)return;
  const turns=askChats[c.id]||(askChats[c.id]=[]);
  const render=()=>{log.innerHTML=turns.map(t=>'<div class="msg '+(t.role==='user'?'me':'ai')+'">'+fmtAns(t.content)+'</div>').join('')};
  render();
  $('#askSug').onclick=e=>{const b=e.target.closest('button');if(b){q.value=b.textContent;go.click()}};
  q.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go.click()}};
  go.disabled=true;go.textContent='…';
  const sample=await askSample;
  if(!document.body.contains(go))return;
  go.disabled=false;
  if(!sample){
    go.textContent='In Claude fragen';
    note.innerHTML='Öffnet Claude mit deiner Frage und dem Karteninhalt. Bleibt das Eingabefeld dort leer: einfügen, der Text ist kopiert.'+(D.artifact&&/^https:\/\/claude\.ai\//.test(D.artifact)?' Antwort direkt hier: <a href="'+esc(D.artifact)+'" target="_blank" rel="noopener">Vorschau auf claude.ai</a>.':'');
    go.onclick=()=>{
      const text=q.value.trim()||'Erklär mir diese Karte einfach.';
      const prompt=askRules(c)+'\n\nFRAGE: '+text;
      try{navigator.clipboard&&navigator.clipboard.writeText(prompt).catch(()=>{})}catch(e){}
      window.open('https://claude.ai/new?q='+encodeURIComponent(prompt),'_blank','noopener');
    };
    return;
  }
  go.textContent='Fragen';
  let ctl=null;
  const MSG={not_granted:'Claude ist für diese Seite nicht freigegeben. Freigeben geht über das Menü der Seite.',sampling_disabled:'Claude ist für dein Konto hier nicht verfügbar.',rate_limited:'Gerade zu viele Fragen. Kurz warten, dann noch einmal.',session_expired:'Bitte bei Claude neu anmelden.',refused:'Claude hat die Frage abgelehnt. Anders formulieren.',prompt_too_large:'Zu lang. Kürzer fragen.'};
  const OFF=['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'];
  go.onclick=async()=>{
    if(ctl){ctl.abort();return}
    const text=q.value.trim();if(!text)return;
    turns.push({role:'user',content:text});q.value='';render();note.textContent='';
    const bubble=document.createElement('div');bubble.className='msg ai';bubble.textContent='Denkt nach …';log.append(bubble);
    ctl=new AbortController();go.textContent='Stopp';
    try{
      const r=await sample([{role:'user',content:askRules(c)},...turns.slice(-8)],{modelTier:'quick',cache:false,signal:ctl.signal,onText:({text})=>{bubble.innerHTML=fmtAns(text)}});
      turns.push({role:'assistant',content:r.text});
      if(r.truncated)note.textContent='Antwort abgeschnitten. Frag kürzer nach.';
    }catch(e){
      const code=e&&e.code;
      if(e&&e.text&&code!=='refused')turns.push({role:'assistant',content:e.text});else{turns.pop();q.value=text}
      if(code!=='cancelled')note.textContent=MSG[code]||'Verbindung unterbrochen. Noch einmal fragen.';
      if(OFF.includes(code)){go.disabled=true}
    }finally{ctl=null;if(!go.disabled)go.textContent='Fragen';render()}
  };
}
